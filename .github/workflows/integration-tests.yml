name: Integration Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  checks: write

env:
  AWS_REGION: us-east-1

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Install CDK dependencies
        run: |
          cd deploy/cdk
          npm ci

      - name: Install Session Manager plugin
        run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb

      - name: Fetch DPDK AMI ID from SSM
        id: ami
        run: |
          AMI_ID=$(aws ssm get-parameter \
            --name /dpdk-stdlib-rust/ami/latest \
            --query "Parameter.Value" \
            --output text 2>/dev/null || echo "")
          if [[ -n "$AMI_ID" ]]; then
            echo "ami_id=${AMI_ID}" >> "$GITHUB_OUTPUT"
            echo "Using pre-built DPDK AMI: ${AMI_ID}"
          else
            echo "ami_id=" >> "$GITHUB_OUTPUT"
            echo "No pre-built AMI found, will use stock AL2023 with full bootstrap"
          fi

      - name: Run integration tests
        id: tests
        run: |
          chmod +x scripts/run-integration-tests.sh
          chmod +x scripts/integration-tests/*.sh
          ./scripts/run-integration-tests.sh default --teardown --json-summary
        env:
          AWS_PROFILE: default
          DPDK_AMI_ID: ${{ steps.ami.outputs.ami_id }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test-results/
          retention-days: 30

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: EC2 Integration Tests
          path: test-results/*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Safety net teardown
        if: failure()
        run: |
          cd deploy/cdk
          npx cdk destroy DpdkTestStack --force || echo "Teardown failed (may already be destroyed)"
        env:
          AWS_PROFILE: default
