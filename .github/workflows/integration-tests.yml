name: Integration Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Only one integration test run at a time — concurrent runs race to create
# and destroy the same CloudFormation stack (DpdkTestStack), causing one
# run's teardown to destroy infrastructure the other run is still using.
# cancel-in-progress: false so the in-flight run finishes cleanly (with
# teardown) rather than being killed mid-deploy and leaving orphaned infra.
concurrency:
  group: integration-tests
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  checks: write

env:
  AWS_REGION: us-east-1

jobs:
  # ── Fast pre-flight validation (no AWS credentials needed) ──────────────────
  # Synthesizes the CDK template locally and validates infrastructure invariants
  # in seconds. Blocks the expensive integration-tests job if anything is wrong.
  #
  # Why this exists: the cfn-signal resource name bug (2026-02-18) caused
  # CloudFormation to wait the full 20-minute timeout before failing. This check
  # catches that class of problem at synth time (scripts/validate-cdk.sh).
  validate-cdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Install CDK dependencies
        run: |
          cd deploy/cdk
          npm install

      - name: Validate CDK template
        run: |
          chmod +x scripts/validate-cdk.sh
          ./scripts/validate-cdk.sh

  # ── Full integration test suite (requires AWS) ──────────────────────────────
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    needs: validate-cdk   # only run if CDK pre-flight passes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install tools first (no AWS credentials needed)
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Install CDK dependencies
        run: |
          cd deploy/cdk
          npm install

      - name: Install Session Manager plugin
        run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb

      # AWS credentials needed from here onward
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch DPDK AMI ID from SSM
        id: ami
        run: |
          AMI_ID=$(aws ssm get-parameter \
            --name /dpdk-stdlib-rust/ami/latest \
            --query "Parameter.Value" \
            --output text 2>/dev/null || echo "")
          if [[ -n "$AMI_ID" ]]; then
            echo "ami_id=${AMI_ID}" >> "$GITHUB_OUTPUT"
            echo "Using pre-built DPDK AMI: ${AMI_ID}"
          else
            echo "ami_id=" >> "$GITHUB_OUTPUT"
            echo "No pre-built AMI found, will use stock AL2023 with full bootstrap"
          fi

      - name: Run integration tests
        id: tests
        run: |
          chmod +x scripts/run-integration-tests.sh
          chmod +x scripts/integration-tests/*.sh
          ./scripts/run-integration-tests.sh default --teardown --json-summary
        env:
          AWS_PROFILE: default
          DPDK_AMI_ID: ${{ steps.ami.outputs.ami_id }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload instance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instance-logs
          path: instance-logs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: EC2 Integration Tests
          path: test-results/*.xml
          reporter: java-junit
          fail-on-error: true
          fail-on-empty: false

      - name: Safety net teardown
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          cd deploy/cdk
          npx cdk destroy DpdkTestStack --force || echo "Teardown failed (may already be destroyed)"
        env:
          AWS_PROFILE: default
