name: Integration Tests

# EC2 integration tests on the primary DPDK LTS line (25.11), x86_64.
# The jobs live in integration-tests-reusable.yml; this file owns the
# triggers, the concurrency group and the README nightly badge.

on:
  # EC2 runs only when something the hardware tests exercise changed; docs,
  # specs and ROADMAP-only PRs skip them (the Rust workflow still runs).
  pull_request:
    branches: [main, development]
    paths:
      - 'apps/**'
      - 'dpdk/**'
      - 'dpdk-sys/**'
      - 'dpdk-stdlib-*/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - 'deploy/**'
      - 'ci/**'
      - '.github/workflows/integration-tests.yml'
      - '.github/workflows/integration-tests-reusable.yml'
  # Scheduled runs happen on the default branch (main). The gate in the
  # reusable workflow skips them when this commit already passed a scheduled
  # run, so quiet days cost nothing.
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC
  workflow_dispatch: {}

# Only one integration test run at a time — concurrent runs race to create
# and destroy the same CloudFormation stack (DpdkTestStack), causing one
# run's teardown to destroy infrastructure the other run is still using.
# cancel-in-progress: false so the in-flight run finishes cleanly (with
# teardown) rather than being killed mid-deploy and leaving orphaned infra.
concurrency:
  group: integration-tests
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  checks: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  dpdk-25-11:
    uses: ./.github/workflows/integration-tests-reusable.yml
    with:
      dpdk_line: '25.11'
      arch: x86_64
      synthetic_perf: true
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
