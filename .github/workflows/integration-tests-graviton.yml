name: Integration Tests (Graviton)

# EC2 integration tests on the primary DPDK LTS line (25.11), arm64 (Graviton).
# The jobs live in integration-tests-reusable.yml; this file owns the
# triggers, the concurrency group and the README nightly badge. The
# architecture-independent synthetic benchmarks run only in the x86 caller
# (they ran on the same x86 GitHub runner here too, so this was a duplicate).

on:
  # EC2 runs only when something the hardware tests exercise changed; docs,
  # specs and ROADMAP-only PRs skip them (the Rust workflow still runs).
  pull_request:
    branches: [main, development]
    paths:
      - 'apps/**'
      - 'dpdk/**'
      - 'dpdk-sys/**'
      - 'dpdk-stdlib-*/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - 'deploy/**'
      - 'ci/**'
      - '.github/workflows/integration-tests-graviton.yml'
      - '.github/workflows/integration-tests-reusable.yml'
  # Scheduled runs happen on the default branch (main). The gate in the
  # reusable workflow skips them when this commit already passed a scheduled
  # run, so quiet days cost nothing.
  schedule:
    - cron: '15 6 * * *' # daily 06:15 UTC
  workflow_dispatch: {}

concurrency:
  group: integration-tests-graviton
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  checks: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  dpdk-25-11:
    uses: ./.github/workflows/integration-tests-reusable.yml
    with:
      dpdk_line: '25.11'
      arch: arm64
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
