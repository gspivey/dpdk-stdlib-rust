name: Build DPDK AMI (Graviton)

# Graviton (arm64) AMIs. Only the primary DPDK LTS line runs EC2 tests on
# Graviton, so only that line is built here. Older supported lines are tested
# on x86 (build-dpdk-ami.yml). See README "Supported DPDK versions".

on:
  schedule:
    - cron: '0 4 * * 0' # Sunday 4:00 AM UTC (weekly); input changes rebuild via push below
  workflow_dispatch:
    inputs:
      dpdk_version:
        description: 'One supported DPDK release to build (e.g. 25.11.4). Leave empty to rebuild every Graviton line.'
        required: false
        default: ''
  push:
    branches: [main, development]
    paths:
      - 'packer/**'
      - 'scripts/install_dpdk_amazon_linux.sh'
      - '.github/workflows/build-dpdk-ami-graviton.yml'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  # DPDK releases built for Graviton: the primary LTS line only.
  SUPPORTED_DPDK_VERSIONS: '["25.11.4"]'
  # Per-line SSM parameters: ${SSM_PREFIX}/dpdk-<line>/latest and .../dpdk-version.
  # The legacy /dpdk-stdlib-rust/ami/graviton/latest is no longer written.
  SSM_PREFIX: /dpdk-stdlib-rust/ami/graviton

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
    steps:
      - name: Pick the DPDK releases to build
        id: plan
        env:
          REQUESTED: ${{ github.event.inputs.dpdk_version || '' }}
        run: |
          if [[ -z "$REQUESTED" ]]; then
            echo "versions=$(jq -c . <<<"$SUPPORTED_DPDK_VERSIONS")" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A manual build must be on a supported line; any point release of it is allowed.
          if [[ ! "$REQUESTED" =~ ^([0-9]{2}\.[0-9]{2})(\.[0-9]+)?$ ]] \
             || ! jq -e --arg l "${BASH_REMATCH[1]}." 'map(startswith($l)) | any' <<<"$SUPPORTED_DPDK_VERSIONS" >/dev/null; then
            echo "::error::DPDK ${REQUESTED} is not a Graviton-tested LTS line. Supported: ${SUPPORTED_DPDK_VERSIONS}"
            exit 1
          fi
          echo "versions=$(jq -cn --arg v "$REQUESTED" '[$v]')" >> "$GITHUB_OUTPUT"

  build-ami:
    needs: plan
    name: build-ami (DPDK ${{ matrix.dpdk_version }}, arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dpdk_version: ${{ fromJSON(needs.plan.outputs.versions) }}
    env:
      DPDK_VERSION: ${{ matrix.dpdk_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: 'latest'

      - name: Initialize Packer
        run: |
          cd packer
          packer init dpdk-ami-graviton.pkr.hcl

      - name: Validate Packer template
        run: |
          cd packer
          packer validate -var "dpdk_version=${DPDK_VERSION}" dpdk-ami-graviton.pkr.hcl

      - name: Build AMI
        id: build
        run: |
          cd packer
          DPDK_LINE=$(grep -oE '^[0-9]{2}\.[0-9]{2}' <<<"$DPDK_VERSION")

          set +e
          packer build \
            -var "aws_region=${{ env.AWS_REGION }}" \
            -var "dpdk_version=${DPDK_VERSION}" \
            -machine-readable \
            dpdk-ami-graviton.pkr.hcl 2>&1 | tee packer-output.log
          PACKER_EXIT=${PIPESTATUS[0]}
          set -e

          if [[ $PACKER_EXIT -ne 0 ]]; then
            PACKER_ERRORS=$(grep -E ',(ui,error|error),' packer-output.log | sed 's/.*,ui,error,//; s/.*,error,//' | tail -5 | tr '\n' ' ' || echo "unknown")
            PACKER_LAST_UI=$(grep ',ui,' packer-output.log | sed 's/.*,ui,[^,]*,//' | tail -3 | tr '\n' ' ' || echo "unknown")
            echo "::error::Packer build failed (exit ${PACKER_EXIT}). Errors: ${PACKER_ERRORS}. Last output: ${PACKER_LAST_UI}"

            {
              echo "## Packer Build Failed (exit code ${PACKER_EXIT})"
              echo ""
              echo "### Error Messages"
              echo '```'
              grep -E ',(ui,error|error),' packer-output.log | sed 's/.*,ui,error,//; s/.*,error,//' | tail -40 || echo "(none)"
              echo '```'
              echo ""
              echo "### Last 80 UI Messages"
              echo '```'
              grep ',ui,' packer-output.log | sed 's/.*,ui,[^,]*,//' | tail -80 || echo "(none)"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            exit $PACKER_EXIT
          fi

          AMI_ID=$(grep 'artifact,0,id' packer-output.log | awk -F, '{print $NF}' | awk -F: '{print $NF}')

          if [[ -z "$AMI_ID" || ! "$AMI_ID" =~ ^ami- ]]; then
            echo "::error::Failed to extract AMI ID from Packer output"
            tail -80 packer-output.log
            exit 1
          fi

          echo "ami_id=${AMI_ID}" >> "$GITHUB_OUTPUT"
          echo "dpdk_line=${DPDK_LINE}" >> "$GITHUB_OUTPUT"
          echo "Built Graviton AMI: ${AMI_ID} (DPDK ${DPDK_VERSION})"

      - name: Upload Packer log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packer-graviton-output-log-${{ matrix.dpdk_version }}
          path: packer/packer-output.log
          retention-days: 7

      - name: Store AMI ID in SSM Parameter Store
        run: |
          AMI_ID="${{ steps.build.outputs.ami_id }}"
          DPDK_LINE="${{ steps.build.outputs.dpdk_line }}"

          if [[ -z "$AMI_ID" || -z "$DPDK_LINE" ]]; then
            echo "::error::AMI ID or DPDK line is empty, cannot store in SSM"
            exit 1
          fi

          PARAM_DIR="${SSM_PREFIX}/dpdk-${DPDK_LINE}"
          echo "Storing Graviton AMI ID ${AMI_ID} in SSM at ${PARAM_DIR}..."
          aws ssm put-parameter \
            --name "${PARAM_DIR}/latest" \
            --type String \
            --value "${AMI_ID}" \
            --overwrite \
            --description "Latest arm64 DPDK ${DPDK_LINE} AMI for dpdk-stdlib-rust integration tests"

          aws ssm put-parameter \
            --name "${PARAM_DIR}/dpdk-version" \
            --type String \
            --value "${DPDK_VERSION}" \
            --overwrite \
            --description "DPDK release in the latest arm64 DPDK ${DPDK_LINE} AMI"

          echo "Stored Graviton AMI ID ${AMI_ID} (DPDK ${DPDK_VERSION}) at ${PARAM_DIR}/latest"
          {
            echo "### DPDK ${DPDK_VERSION} arm64 AMI"
            echo ""
            echo "- AMI: \`${AMI_ID}\`"
            echo "- SSM: \`${PARAM_DIR}/latest\`, \`${PARAM_DIR}/dpdk-version\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deregister old Graviton AMIs of this line (keep last 3)
        run: |
          # Prune only arm64 DPDK AMIs of the line just built (DpdkLine tag).
          # AMIs built before per-line tagging carry no DpdkLine tag and are
          # never matched; deregister those by hand once nothing reads them.
          DPDK_LINE="${{ steps.build.outputs.dpdk_line }}"
          if [[ -z "$DPDK_LINE" ]]; then
            echo "::error::DPDK line is empty, refusing to prune"
            exit 1
          fi
          OLD_AMIS=$(aws ec2 describe-images \
            --owners self \
            --filters "Name=tag:ManagedBy,Values=packer" "Name=tag:Repository,Values=dpdk-stdlib-rust" "Name=name,Values=dpdk-stdlib-rust-graviton-dpdk-${DPDK_LINE}*" "Name=tag:Arch,Values=arm64" "Name=tag:DpdkLine,Values=${DPDK_LINE}" \
            --query "sort_by(Images, &CreationDate)[:-3].ImageId" \
            --output text)

          for ami_id in $OLD_AMIS; do
            echo "Deregistering old Graviton AMI: $ami_id"
            SNAPSHOTS=$(aws ec2 describe-images \
              --image-ids "$ami_id" \
              --query "Images[0].BlockDeviceMappings[*].Ebs.SnapshotId" \
              --output text)

            aws ec2 deregister-image --image-id "$ami_id"

            for snap_id in $SNAPSHOTS; do
              echo "Deleting snapshot: $snap_id"
              aws ec2 delete-snapshot --snapshot-id "$snap_id" || true
            done
          done
