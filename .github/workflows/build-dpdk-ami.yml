name: Build DPDK AMI

on:
  schedule:
    - cron: '0 4 * * 0' # Sunday 4:00 AM UTC (weekly)
  workflow_dispatch:
    inputs:
      dpdk_version:
        description: 'DPDK version to build'
        required: false
        default: '22.11.6'
  push:
    branches: [main]
    paths:
      - 'packer/**'
      - 'scripts/install_dpdk_amazon_linux.sh'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  SSM_AMI_PARAMETER: /dpdk-stdlib-rust/ami/latest
  SSM_DPDK_VERSION_PARAMETER: /dpdk-stdlib-rust/ami/dpdk-version

jobs:
  build-ami:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: 'latest'

      - name: Initialize Packer
        run: |
          cd packer
          packer init dpdk-ami.pkr.hcl

      - name: Validate Packer template
        run: |
          cd packer
          packer validate dpdk-ami.pkr.hcl

      - name: Build AMI
        id: build
        run: |
          cd packer
          DPDK_VERSION="${{ github.event.inputs.dpdk_version || '22.11.6' }}"

          # Run packer without pipefail swallowing diagnostics.
          # Capture exit code manually so we can dump logs on failure.
          set +e
          packer build \
            -var "aws_region=${{ env.AWS_REGION }}" \
            -var "dpdk_version=${DPDK_VERSION}" \
            -machine-readable \
            dpdk-ami.pkr.hcl 2>&1 | tee packer-output.log
          PACKER_EXIT=${PIPESTATUS[0]}
          set -e

          if [[ $PACKER_EXIT -ne 0 ]]; then
            echo "::error::Packer build failed with exit code ${PACKER_EXIT}"
            echo ""
            echo "=== Human-readable error messages ==="
            # Machine-readable error lines contain ,ui,error, or ,error,
            grep -E ',(ui,error|error),' packer-output.log | sed 's/.*,ui,error,//; s/.*,error,//' | tail -40 || echo "(none)"
            echo ""
            echo "=== Human-readable UI messages (last 60 lines) ==="
            # Extract the human-readable message portion from machine-readable output
            grep ',ui,' packer-output.log | sed 's/.*,ui,[^,]*,//' | tail -60 || echo "(none)"
            echo ""
            echo "=== Raw packer output (last 100 lines) ==="
            tail -100 packer-output.log
            exit $PACKER_EXIT
          fi

          # Extract AMI ID from packer machine-readable output
          # Format: timestamp,target,artifact,0,id,region:ami-xxx
          AMI_ID=$(grep 'artifact,0,id' packer-output.log | awk -F, '{print $NF}' | awk -F: '{print $NF}')

          if [[ -z "$AMI_ID" || ! "$AMI_ID" =~ ^ami- ]]; then
            echo "::error::Failed to extract AMI ID from Packer output"
            echo ""
            echo "=== Packer output (last 80 lines) ==="
            tail -80 packer-output.log
            echo ""
            echo "=== Lines matching 'artifact' ==="
            grep -i 'artifact' packer-output.log || echo "(none)"
            exit 1
          fi

          echo "ami_id=${AMI_ID}" >> "$GITHUB_OUTPUT"
          echo "dpdk_version=${DPDK_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Built AMI: ${AMI_ID}"

      - name: Store AMI ID in SSM Parameter Store
        run: |
          AMI_ID="${{ steps.build.outputs.ami_id }}"
          DPDK_VERSION="${{ steps.build.outputs.dpdk_version }}"

          if [[ -z "$AMI_ID" ]]; then
            echo "::error::AMI ID is empty, cannot store in SSM"
            exit 1
          fi

          echo "Storing AMI ID ${AMI_ID} in SSM..."
          aws ssm put-parameter \
            --name "${{ env.SSM_AMI_PARAMETER }}" \
            --type String \
            --value "${AMI_ID}" \
            --overwrite \
            --description "Latest DPDK AMI for dpdk-stdlib-rust integration tests"

          aws ssm put-parameter \
            --name "${{ env.SSM_DPDK_VERSION_PARAMETER }}" \
            --type String \
            --value "${DPDK_VERSION}" \
            --overwrite \
            --description "DPDK version in the latest pre-built AMI"

          echo "Stored AMI ID ${AMI_ID} in SSM at ${{ env.SSM_AMI_PARAMETER }}"

      - name: Deregister old AMIs (keep last 3)
        run: |
          # List all AMIs with our naming pattern, sorted by creation date (oldest first)
          OLD_AMIS=$(aws ec2 describe-images \
            --owners self \
            --filters "Name=tag:ManagedBy,Values=packer" "Name=tag:Repository,Values=dpdk-stdlib-rust" \
            --query "sort_by(Images, &CreationDate)[:-3].ImageId" \
            --output text)

          for ami_id in $OLD_AMIS; do
            echo "Deregistering old AMI: $ami_id"
            # Get snapshot IDs before deregistering
            SNAPSHOTS=$(aws ec2 describe-images \
              --image-ids "$ami_id" \
              --query "Images[0].BlockDeviceMappings[*].Ebs.SnapshotId" \
              --output text)

            aws ec2 deregister-image --image-id "$ami_id"

            for snap_id in $SNAPSHOTS; do
              echo "Deleting snapshot: $snap_id"
              aws ec2 delete-snapshot --snapshot-id "$snap_id" || true
            done
          done
