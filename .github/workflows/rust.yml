name: Rust

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  semver:
    # Additive-only check against the v0.3.0 release (tokio-udp-perf spec, task 6.1).
    # dpdk-stdlib-tokio is checked both with and without its `dpdk` feature because the
    # auto-trait outcome differs by feature; every other crate uses default features only.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install cargo-semver-checks
      run: cargo install cargo-semver-checks --locked
    - name: Semver check (default features)
      run: |
        cargo semver-checks --baseline-rev v0.3.0 \
          -p dpdk-stdlib-sys -p dpdk-stdlib -p dpdk-stdlib-net -p dpdk-stdlib-udp \
          -p dpdk-stdlib-tcp -p dpdk-stdlib-quic -p dpdk-stdlib-tokio
    - name: Semver check (dpdk-stdlib-tokio --features dpdk)
      run: cargo semver-checks --baseline-rev v0.3.0 -p dpdk-stdlib-tokio --features dpdk
    - name: Auto-trait assertions (workspace root, dpdk feature unified on)
      run: cargo test -p dpdk-stdlib-udp thread_safety && cargo test -p dpdk-stdlib-tokio --test dpdk_mock_backend
    - name: Auto-trait assertions (dpdk-stdlib-tokio without feature)
      run: cargo test -p dpdk-stdlib-tokio

  dpdk-compat:
    # Compiles the real-DPDK (bindgen) path against every supported DPDK LTS.
    # The `build` job above only exercises the stub backend, and the EC2
    # integration tests pin one DPDK release, so layout changes in newer DPDK
    # headers (e.g. the anonymous unions added to rte_mbuf and rte_eth_link in
    # 24.07) would otherwise go unnoticed. DPDK is built minimally (no apps,
    # tests or examples; a few virtual drivers) and the install prefix is
    # cached per version. Bump DPDK_BUILD_REV when changing the meson options.
    name: DPDK ${{ matrix.dpdk.series }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dpdk:
          - series: "22.11"
            version: "22.11.11"
            sha256: 27a3bb1f57e02eb68c7c0a6f8bbf9fb74ec198c5aab74ed602da5b71c492a476
          - series: "23.11"
            version: "23.11.8"
            sha256: 17fa62321481618b735c029b652e37f8adf0e2233fced6dc1a2c9058c2d21259
          - series: "24.11"
            version: "24.11.8"
            sha256: f3dbfac841b2db8e53a97d68a5e14ebc943327a955f0afb97f8c14f544fbc4aa
    env:
      DPDK_BUILD_REV: "1"
      DPDK_PREFIX: /home/runner/dpdk-install
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential meson ninja-build python3-pyelftools \
          libnuma-dev pkg-config libclang-dev clang

    - name: Identify OS image
      id: os
      run: |
        . /etc/os-release
        echo "id=${ID}-${VERSION_ID}" >> "$GITHUB_OUTPUT"

    - name: Cache DPDK install
      id: dpdk-cache
      uses: actions/cache@v4
      with:
        path: ${{ env.DPDK_PREFIX }}
        key: dpdk-${{ matrix.dpdk.version }}-${{ steps.os.outputs.id }}-rev${{ env.DPDK_BUILD_REV }}

    - name: Build DPDK ${{ matrix.dpdk.version }}
      if: steps.dpdk-cache.outputs.cache-hit != 'true'
      run: |
        cd "$RUNNER_TEMP"
        curl -fsSLO "https://fast.dpdk.org/rel/dpdk-${{ matrix.dpdk.version }}.tar.xz"
        echo "${{ matrix.dpdk.sha256 }}  dpdk-${{ matrix.dpdk.version }}.tar.xz" | sha256sum -c -
        mkdir dpdk-src
        tar -xJf "dpdk-${{ matrix.dpdk.version }}.tar.xz" -C dpdk-src --strip-components=1
        cd dpdk-src
        meson setup build \
          --prefix="$DPDK_PREFIX" \
          -Dlibdir=lib \
          -Dplatform=generic \
          -Ddefault_library=shared \
          -Dtests=false \
          -Ddisable_apps='*' \
          -Denable_drivers=bus/vdev,mempool/ring,net/null,net/ring
        ninja -C build install

    - name: Point pkg-config at DPDK
      run: |
        echo "PKG_CONFIG_PATH=$DPDK_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$DPDK_PREFIX/lib" >> "$GITHUB_ENV"
        PKG_CONFIG_PATH="$DPDK_PREFIX/lib/pkgconfig" pkg-config --modversion libdpdk

    - name: Build workspace (bindgen backend)
      run: |
        cargo build --workspace --features dpdk-stdlib-sys/bindgen 2>&1 | tee "$RUNNER_TEMP/build.log"
        # build.rs only warns when it falls back to stubs; make that fatal here.
        if grep -q "using stub implementations" "$RUNNER_TEMP/build.log"; then
          echo "::error::dpdk-stdlib-sys fell back to stubs; the real-DPDK path was not compiled"
          exit 1
        fi
        ls target/debug/build/dpdk-stdlib-sys-*/out/bindings.rs

    - name: Build workspace tests (bindgen backend)
      run: cargo test --workspace --features dpdk-stdlib-sys/bindgen --no-run

    - name: Assert the real DPDK backend is active
      run: DPDK_STDLIB_EXPECT_BACKEND=bindgen cargo test -p dpdk-stdlib-sys --features bindgen --test backend
