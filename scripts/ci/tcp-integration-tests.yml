# TCP Integration Tests — GitHub Actions workflow
#
# This file should be placed at .github/workflows/tcp-integration-tests.yml
# It requires a PAT with `workflow` scope to push to that location.
#
# Move manually: cp scripts/ci/tcp-integration-tests.yml .github/workflows/

name: TCP Integration Tests

on:
  pull_request:
    branches: [main, development]
  workflow_dispatch: {}

concurrency:
  group: tcp-integration-tests
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  checks: write
  pull-requests: write
  issues: write

env:
  AWS_REGION: us-east-1

jobs:
  # ── TCP Synthetic Performance Test (no AWS credentials needed) ─────────────
  tcp-synthetic-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-tcp-synth-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-tcp-synth-

      - name: Run TCP synthetic benchmark
        id: bench
        run: |
          cargo build --release -p tcp-synthetic-bench
          cargo run --release -p tcp-synthetic-bench > /tmp/tcp-bench-results.md 2>/tmp/tcp-bench-stderr.log
          cat /tmp/tcp-bench-stderr.log >&2
          cat /tmp/tcp-bench-results.md

      - name: Post results to PR
        if: github.event_name == 'pull_request'
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR number, skipping comment"
            exit 0
          fi

          REPORT="/tmp/tcp-synth-perf-report.md"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "## TCP Synthetic Performance Results ([run](${RUN_URL}))" > "$REPORT"
          echo "" >> "$REPORT"
          echo "Commit: \`${GITHUB_SHA:0:8}\`" >> "$REPORT"
          echo "" >> "$REPORT"
          cat /tmp/tcp-bench-results.md >> "$REPORT"

          gh pr comment "$PR_NUMBER" --body-file "$REPORT" --repo ${{ github.repository }} 2>/dev/null \
            || echo "::warning::Could not post TCP synthetic perf PR comment"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcp-synthetic-bench-results
          path: /tmp/tcp-bench-results.md
          retention-days: 30
          if-no-files-found: ignore

  # ── TCP Integration Tests (requires AWS, non-blocking) ─────────────────────
  # TCP test failures do not block CI while the TCP stack matures.
  # Remove continue-on-error once ≥10/10 recent runs pass.
  tcp-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Install CDK dependencies
        run: |
          cd deploy/cdk
          npm install

      - name: Install Session Manager plugin
        run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch DPDK AMI ID from SSM
        id: ami
        run: |
          AMI_ID=$(aws ssm get-parameter \
            --name /dpdk-stdlib-rust/ami/latest \
            --query "Parameter.Value" \
            --output text 2>/dev/null || echo "")
          if [[ -n "$AMI_ID" ]]; then
            echo "ami_id=${AMI_ID}" >> "$GITHUB_OUTPUT"
          else
            echo "ami_id=" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve PR number
        id: pr
        run: |
          if [[ -n "${{ github.event.pull_request.number }}" ]]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            PR=$(gh pr list --head "${{ github.ref_name }}" --json number --jq '.[0].number' 2>/dev/null || echo "")
            echo "number=${PR}" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run TCP integration tests
        id: tcp-tests
        run: |
          chmod +x scripts/run-integration-tests.sh
          chmod +x scripts/integration-tests/*.sh
          ./scripts/run-integration-tests.sh --teardown --json-summary
        env:
          DPDK_AMI_ID: ${{ steps.ami.outputs.ami_id }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_HEAD_REF: ${{ github.head_ref || github.ref_name }}

      - name: Post TCP test results to PR
        if: always()
        run: |
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR number — skipping TCP results comment"
            exit 0
          fi

          REPORT="/tmp/tcp-test-report.md"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "## ⚠️ TCP Integration Tests (non-blocking) ([run](${RUN_URL}))" > "$REPORT"
          echo "" >> "$REPORT"
          echo "Branch: \`${{ github.ref_name }}\` | Commit: \`${GITHUB_SHA:0:8}\`" >> "$REPORT"
          echo "" >> "$REPORT"
          echo "> TCP tests run with \`continue-on-error: true\` — failures do not block CI." >> "$REPORT"
          echo "" >> "$REPORT"

          echo "### Test Results" >> "$REPORT"
          for xml in test-results/*tcp*.xml; do
            [ -f "$xml" ] || continue
            BASENAME=$(basename "$xml")
            TESTS=$(grep -oP 'tests="\K[^"]+' "$xml" 2>/dev/null | head -1 || echo "0")
            FAILURES=$(grep -oP 'failures="\K[^"]+' "$xml" 2>/dev/null | head -1 || echo "0")
            SKIPPED=$(grep -oP 'skipped="\K[^"]+' "$xml" 2>/dev/null | head -1 || echo "0")
            ICON="✅"; [ "$FAILURES" != "0" ] && ICON="❌"
            echo "- ${ICON} **${BASENAME}**: ${TESTS} tests, ${FAILURES} failures, ${SKIPPED} skipped" >> "$REPORT"
          done
          echo "" >> "$REPORT"

          if [ "$(wc -c < "$REPORT")" -gt 60000 ]; then
            head -c 59000 "$REPORT" > /tmp/truncated.md
            mv /tmp/truncated.md "$REPORT"
          fi

          gh pr comment "$PR_NUMBER" --body-file "$REPORT" --repo ${{ github.repository }} 2>/dev/null \
            || echo "::warning::Could not post TCP test results PR comment"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload TCP test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcp-integration-test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload TCP instance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcp-instance-logs
          path: instance-logs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Publish TCP test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: TCP Integration Tests
          path: test-results/*tcp*.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false
