[package]
name = "tokio-echo"
version = "0.1.0"
edition = "2021"
description = "Async UDP Echo Server using Tokio with DPDK support"

[features]
default = []
dpdk = ["dpdk-tokio/dpdk"]

[dependencies]
dpdk-tokio = { path = "../../dpdk-tokio" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
