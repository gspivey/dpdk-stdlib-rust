[package]
name = "test-client"
version = "0.1.0"
edition = "2021"

[features]
default = []
dpdk = ["dpdk-tokio/dpdk"]

[dependencies]
clap = { version = "4.0", features = ["derive"] }
dpdk-tokio = { path = "../../dpdk-tokio" }
tokio = { version = "1.0", features = ["net", "rt-multi-thread", "macros", "time"] }
