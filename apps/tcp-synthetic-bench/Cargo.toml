edition.workspace = true
license.workspace = true

[[bin]]
name = "tcp-synthetic-bench"
path = "src/main.rs"

[dependencies]
dpdk-stdlib-tcp = { path = "../../dpdk-stdlib-tcp" }
dpdk-stdlib-net = { path = "../../dpdk-stdlib-net" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
