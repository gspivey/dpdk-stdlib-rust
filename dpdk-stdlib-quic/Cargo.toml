[package]
name = "dpdk-stdlib-quic"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Native DPDK I/O provider for s2n-quic (kernel-bypass QUIC transport)"

[dependencies]
s2n-quic = "=1.81.0"
s2n-quic-core = "=0.81.0"
dpdk-udp = { version = "0.2.0", path = "../dpdk-udp", package = "dpdk-stdlib-udp" }
dpdk = { version = "0.2.0", path = "../dpdk", package = "dpdk-stdlib" }
thiserror = { workspace = true }
futures = "0.3"
tokio = { workspace = true }
rcgen = "0.13"
bytes = "1"

[dev-dependencies]
serial_test = { workspace = true }

[[bin]]
name = "quic-smoke"
path = "src/bin/quic-smoke.rs"

[[bin]]
name = "quic-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "quic-echo-server"
path = "src/bin/quic-echo-server.rs"

[[bin]]
name = "quic-test-client"
path = "src/bin/quic-test-client.rs"

[[bin]]
name = "quic-perf-client"
path = "src/bin/quic-perf-client.rs"
