[workspace]
resolver = "2"
members = [
  "dpdk-sys",
  "dpdk",
  "dpdk-udp",
  "dpdk-tokio",
  "apps/echo",
  "apps/test-client",
  "apps/tokio-echo",
  "apps/plain-echo",
]

[workspace.dependencies]
thiserror = "1"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serial_test = "3"
